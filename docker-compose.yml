version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ../dataset:/app/dataset
    environment:
      - SI_DB_PATH=/app/data/store_intelligence.db
      - SI_POS_CSV_PATH=/app/dataset/Brigade_Bangalore_10_April_26 (1)bc6219c.csv
      - SI_STORE_LAYOUT_PATH=/app/data/store_layout.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
